<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      try {
        var prefs = JSON.parse(localStorage.getItem("ui-preferences") || "{}");
        var root = document.documentElement;
        if (prefs.theme === "light" || prefs.theme === "dark") root.dataset.theme = prefs.theme;
        if (prefs.font === "serif" || prefs.font === "mono") root.dataset.font = prefs.font;
        if (prefs.fontSize === "small" || prefs.fontSize === "large") root.dataset.fontSize = prefs.fontSize;
      } catch (error) {}
    </script>
    <title>万能工具箱</title>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
